name: Build Agent Jeff Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AgentJeff.csproj
      - name: Build
        run: dotnet build AgentJeff.csproj --configuration Release --no-restore
      - name: Publish portable folder
        run: dotnet publish AgentJeff.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/Agent-Jeff-win-x64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Jeff-win-x64
          path: artifacts/Agent-Jeff-win-x64/
          if-no-files-found: error

name: Build JT Desktop Agent macOS and Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-13
            rid: osx-x64
          - name: macOS ARM64
            os: macos-14
            rid: osx-arm64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore cross-platform/JTDesktopAgent.CrossPlatform.csproj
      - name: Build
        run: dotnet build cross-platform/JTDesktopAgent.CrossPlatform.csproj --configuration Release --no-restore
      - name: Publish native app
        run: dotnet publish cross-platform/JTDesktopAgent.CrossPlatform.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output artifacts/JT-Desktop-Agent-${{ matrix.rid }}
      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: JT-Desktop-Agent-${{ matrix.rid }}
          path: artifacts/JT-Desktop-Agent-${{ matrix.rid }}/
          if-no-files-found: error
